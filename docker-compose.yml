services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Keep the container database inside the persistent bind mount.
      DB_PATH: /app/data/offers.sqlite3
      PORT: "3000"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${HEALTH_PORT:-3000}:3000"
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
